<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Movie-Website</title>
</head>
<body>
    <header>
        <div class="logo">CINEBOX</div>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./movies.html">Movies</a></li>
                <li><a href="./list.html">My List</a><span id="count">0</span></li>
            </ul>
        </nav>
    </header>
    <div class="bbb">
        <a href="./movies.html"> <-Back to home</a>
    </div>
   
    <main id="mainn">
        <div class="movie">
            <img src="" alt="">
            <h3></h3>
            <h4></h4>
            <p></p>
        </div>
    </main>

    <script>
        document.querySelector("img").src=localStorage.getItem("poster");
        document.querySelector("h3").innerHTML=localStorage.getItem("title");
        document.querySelector("h4").innerHTML=localStorage.getItem("rating");
        document.querySelector("p").innerHTML=localStorage.getItem("description");
    </script>
    <style>
        #mainn{
            height: 100vh;
            width: 100%;
           
        }
        .movie{
            overflow-x: hidden;
            height: 100vh;
            color: white;
            position: relative;
            padding-left: 20px;
        }
        .movie img{
            width: 60%;
            object-fit: cover;
            border-radius: 12px;
            position: relative;
        }
        .movie h3{
            font-size: 50px;
            font-family: "Oswald", sans-serif ;
            position: absolute;
            top: 360px;
            left: 75px;
            color: yellow;
         
        }
        .movie p{
            font-family:"Inter", sans-serif;
            padding-top: 10px;
            font-size: 18px;
        }
        .movie h4{
            position: absolute;
            top: 20px;
            right: 550px;
            color:yellow;
            font-size: 20px;
        }
        .bbb{
            padding-left: 50px;
            padding-top: 10px;   
        }
        .bbb a{
            font-family:"Inter", sans-serif;
            font-size: 15px;
        }
    </style>
</body>
</html>
