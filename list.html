<style>
    #watchlist{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        padding-top: 30px;
        width: 80%;
        margin: auto;
        gap: 12px;
    }
    .items{
        position: relative;
    }
    .items img{
        position: relative;
    }
    .remove{
        position: absolute;
       position: absolute;
        right: 12px;
       top: 12px;
       font-size: 20px;
       width: 29px;
       height: 29px;
       border: 1px solid rgba(255, 255, 255, .35);
       border-radius: 50%;
       display: grid;
       place-items: center;
       background: rgba(13, 14, 15, .62);
       color: white;
       line-height: 1;
       transition: .2s 
        
    }
    .remove:hover{
        background-color: yellow;
        color: black;
    }
